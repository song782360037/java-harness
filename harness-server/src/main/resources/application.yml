spring:
  servlet:
    multipart:
      max-file-size: 16MB
      max-request-size: 17MB
  application:
    name: java-harness
  datasource:
    url: jdbc:h2:file:./data/harness;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 4
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 10s

server:
  address: 127.0.0.1
  port: ${HARNESS_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

harness:
  plugins:
    directory: ${HARNESS_PLUGIN_DIRECTORY:./data/plugins}
  settings:
    key-file: ${HARNESS_SETTINGS_KEY_FILE:./data/settings.key}
  session-naming:
    enabled: ${HARNESS_SESSION_NAMING_ENABLED:true}
  automations:
    enabled: ${HARNESS_AUTOMATIONS_ENABLED:true}
    check-interval: ${HARNESS_AUTOMATIONS_CHECK_INTERVAL:30s}
  tools:
    max-tools-per-request: ${HARNESS_MAX_TOOLS_PER_REQUEST:200}
    timeout: ${HARNESS_TOOL_TIMEOUT:300s}
  run-timeout: ${HARNESS_RUN_TIMEOUT:6000s}
  context:
    window-tokens: ${HARNESS_CONTEXT_WINDOW_TOKENS:256000}
    max-output-tokens: ${HARNESS_MAX_OUTPUT_TOKENS:32000}
  model:
    base-url: ${HARNESS_MODEL_BASE_URL:https://api.openai.com/v1}
    api-key: ${HARNESS_MODEL_API_KEY:}
    api-key-required: ${HARNESS_MODEL_API_KEY_REQUIRED:true}
    name: ${HARNESS_MODEL_NAME:}
    connect-timeout: 30s
