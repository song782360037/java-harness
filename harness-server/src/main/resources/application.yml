spring:
  application:
    name: java-harness
  datasource:
    url: jdbc:h2:file:./data/harness;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 4
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 10s

server:
  address: 127.0.0.1
  port: ${HARNESS_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

harness:
  run-timeout: 15s
  simulated-chunk-delay: 100
