spring:
  application:
    name: java-harness
  datasource:
    url: jdbc:h2:file:./data/harness;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 4
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 10s

server:
  address: 127.0.0.1
  port: ${HARNESS_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

harness:
  settings:
    key-file: ${HARNESS_SETTINGS_KEY_FILE:./data/settings.key}
  tools:
    max-steps: ${HARNESS_TOOLS_MAX_STEPS:0}
    timeout: ${HARNESS_TOOL_TIMEOUT:5s}
  run-timeout: ${HARNESS_RUN_TIMEOUT:120s}
  context:
    max-characters: ${HARNESS_CONTEXT_MAX_CHARACTERS:32000}
  model:
    base-url: ${HARNESS_MODEL_BASE_URL:https://api.openai.com/v1}
    api-key: ${HARNESS_MODEL_API_KEY:}
    api-key-required: ${HARNESS_MODEL_API_KEY_REQUIRED:true}
    name: ${HARNESS_MODEL_NAME:}
    connect-timeout: 10s
