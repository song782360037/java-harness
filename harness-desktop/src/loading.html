<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>Java Harness</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(60% 50% at 50% 42%, rgba(159, 216, 181, 0.1), transparent 72%), #181d1a;
      color: #e8eee9;
      font: 500 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei UI", sans-serif;
      letter-spacing: .01em;
    }
    .bar { width: 168px; height: 3px; border-radius: 999px; background: rgba(232, 238, 233, .12); overflow: hidden; }
    .bar::after {
      content: ""; display: block; width: 42%; height: 100%; border-radius: 999px; background: #9fd8b5;
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div>正在启动 Java Harness…</div>
  <div class="bar"></div>
</body>
</html>
