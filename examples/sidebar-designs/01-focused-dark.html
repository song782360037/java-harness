<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>方案 A · Codex 极简任务导航</title>
<style>
:root{color-scheme:light;--page:#fff;--side:#f6f7f5;--line:#e3e7e1;--text:#29352d;--muted:#718078;--accent:#315f46;--soft:#e7eee7}*{box-sizing:border-box}body{margin:0;color:var(--text);font:13px/1.5 system-ui,"Microsoft YaHei",sans-serif;background:var(--page)}button,input{font:inherit}.app{display:flex;height:100vh}.side{width:248px;flex:none;background:var(--side);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:9px;padding:3px 8px 22px}.logo{width:27px;height:27px;display:grid;place-items:center;border-radius:7px;background:#293b30;color:#e5f3e7;font-weight:700}.brand strong{font-size:13px}.brand small{display:block;color:var(--muted);font-size:10px}.new{width:100%;display:flex;justify-content:space-between;align-items:center;border:1px solid #d5ded5;background:#fff;color:var(--text);padding:9px 11px;border-radius:7px;cursor:pointer}.new span{color:var(--muted)}.section{margin:20px 7px 5px;color:var(--muted);font-size:10px;letter-spacing:.08em}.item{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;border-radius:6px;padding:8px;color:#4c5b51;text-align:left;cursor:pointer}.item:hover{background:#ecefea}.item.active{background:#dfe9e1;color:#234b34;font-weight:600}.item small{margin-left:auto;color:var(--muted)}.footer{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line)}.settings{border:0;background:transparent;width:100%;padding:8px;text-align:left;cursor:pointer;color:#526358}.main{flex:1;min-width:0}.top{height:58px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 28px;font-size:12px}.content{max-width:720px;padding:74px 50px}.content h1{font-size:30px;font-weight:600;letter-spacing:-1px;margin:12px 0}.content p{color:var(--muted);max-width:480px}.run{border:1px solid var(--line);border-radius:10px;padding:20px;margin-top:35px}.run h2{font-size:13px;margin:0 0 9px}.run p{font-size:12px;margin:0}.status{color:#3b7252;background:#e8f2e9;border-radius:4px;padding:3px 6px;font-size:10px}.note{position:fixed;bottom:12px;right:18px;color:var(--muted);font-size:11px}.menu{display:none}@media(max-width:760px){.side{display:none;position:fixed;z-index:2;inset:0 auto 0 0;box-shadow:12px 0 30px #0002}.side.open{display:flex}.menu{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:5px;padding:4px 8px}.content{padding:50px 24px}}
</style></head><body><div class="app"><aside class="side" id="side"><div class="brand"><div class="logo">H</div><div><strong>Harness</strong><small>本地工作空间</small></div><button class="menu" onclick="toggle()" aria-label="关闭导航">×</button></div><button class="new" onclick="activate(this,'新任务')">＋ 新建任务 <span>⌘ N</span></button><div class="section">工作区</div><button class="item active" onclick="activate(this,'订单服务')">▱ 订单服务 <small>4</small></button><button class="item" onclick="activate(this,'开发者门户')">▱ 开发者门户 <small>2</small></button><div class="section">最近任务</div><button class="item" onclick="activate(this,'排查库存超时')">◷ 排查库存超时 <small>运行中</small></button><button class="item" onclick="activate(this,'整理鉴权方案')">✓ 整理鉴权方案</button><button class="item" onclick="activate(this,'生成回归用例')">✓ 生成回归用例</button><div class="footer"><button class="settings" onclick="activate(this,'设置与偏好')">⚙ 设置与偏好</button></div></aside><main class="main"><header class="top"><button class="menu" onclick="toggle()" aria-label="打开导航">☰</button><span id="title">订单服务</span><span>● 本地已连接</span></header><div class="content"><span class="status">任务工作区</span><h1>从任务开始，<br>在项目里持续交付。</h1><p>项目承担长期上下文，任务承载一次明确目标。右侧保留执行结果与文件变更，不打断当前对话。</p><div class="run"><h2>最近交付</h2><p>库存服务调用链分析已完成，可继续查看变更或发起下一轮任务。</p></div></div></main></div><script>function activate(el,title){document.querySelectorAll('.item,.new').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.getElementById('title').textContent=title}function toggle(){document.getElementById('side').classList.toggle('open')}</script></body></html>
