<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>方案 C · 项目树与状态导航</title><style>
*{box-sizing:border-box}body{margin:0;font:13px/1.5 system-ui,"Microsoft YaHei",sans-serif;color:#29372e;background:#fff}.app{display:flex;height:100vh}.side{width:278px;background:#f7f8f6;border-right:1px solid #dfe5de;display:flex;flex-direction:column;flex:none}.head{padding:22px 18px 18px;border-bottom:1px solid #e0e6df}.head h1{font-size:16px;margin:4px 0}.head small{font-size:10px;color:#748279;letter-spacing:.08em}.search{margin:14px;border:1px solid #d8e0d8;border-radius:6px;background:#fff;padding:7px 9px}.search input{border:0;outline:0;width:100%;font-size:12px}.search:focus-within{outline:2px solid #94b49d}.tree{padding:0 10px;overflow:auto}.group{padding:13px 8px 6px;color:#718078;font-size:10px;letter-spacing:.06em}.row{display:flex;gap:8px;align-items:center;width:100%;padding:9px;border:0;background:transparent;border-radius:6px;color:#52645a;text-align:left;cursor:pointer}.row:hover{background:#e9eee8}.row.active{background:#e2ece3;color:#315d40;font-weight:600}.row small{margin-left:auto;color:#718078;font-size:10px}.child{padding-left:22px}.foot{margin-top:auto;border-top:1px solid #dfe5de;padding:14px 18px;color:#718078;font-size:11px}.main{flex:1;min-width:0}.top{height:60px;border-bottom:1px solid #e0e6df;display:flex;align-items:center;justify-content:space-between;padding:0 30px;color:#718078;font-size:12px}.content{max-width:740px;padding:76px 7vw}.content h2{font-size:30px;letter-spacing:-1px;margin:14px 0}.content p{color:#718078;max-width:470px}.card{margin-top:30px;padding:20px;border:1px solid #dfe6df;border-radius:10px;background:#fbfcfa}.card h3{font-size:13px;margin:0 0 10px}.card p{font-size:12px;margin-bottom:0}.tag{font-size:10px;color:#477653;background:#e8f1e8;padding:4px 6px;border-radius:4px}.note{position:fixed;right:18px;bottom:12px;font-size:11px;color:#718078}.menu{display:none}@media(max-width:760px){.side{display:none;position:fixed;z-index:2;inset:0 auto 0 0;box-shadow:12px 0 30px #0002}.side.open{display:flex}.menu{display:inline-block;border:1px solid #d8e0d8;background:#fff;border-radius:5px;padding:4px 8px}.content{padding:50px 24px}}
</style></head><body><div class="app"><aside class="side" id="side"><button class="menu" onclick="toggle()" aria-label="关闭导航">×</button><div class="head"><small>LOCAL PROJECTS</small><h1>项目与会话</h1></div><div class="search">⌕ <input aria-label="搜索项目与会话" placeholder="搜索项目与会话" oninput="filterItems(this.value)"></div><nav class="tree"><div class="group">PROJECTS</div><button class="row active" data-title="订单服务" onclick="selectItem(this)">▱ <span>订单服务</span><small>4</small></button><div class="child"><button class="row" data-title="库存接口调用链" onclick="selectItem(this)">↳ 库存接口调用链</button><button class="row" data-title="缓存一致性方案" onclick="selectItem(this)">↳ 缓存一致性方案</button></div><button class="row" data-title="开发者门户" onclick="selectItem(this)">▱ <span>开发者门户</span><small>2</small></button><button class="row" data-title="运维知识库" onclick="selectItem(this)">▱ <span>运维知识库</span><small>8</small></button><div class="group">UNASSIGNED</div><button class="row" data-title="临时问答" onclick="selectItem(this)">◫ 临时问答</button></nav><div class="foot">设置与偏好 · 本地数据</div></aside><main class="main"><header class="top"><button class="menu" onclick="toggle()">☰</button><span id="title">订单服务 / 会话</span><span>● 本地环境</span></header><div class="content"><span class="tag">项目工作区</span><h2>把项目留在视野里，<br>把会话变成下一步。</h2><p>项目作为稳定的工作边界，会话作为轻量执行单元。支持折叠和快速过滤，适合多个仓库并行工作的场景。</p><div class="card"><h3>项目上下文</h3><p>当前目录、历史会话和运行任务统一关联，避免重复选择环境。</p></div></div></main></div><script>function selectItem(el){document.querySelectorAll('.row').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.getElementById('title').textContent=el.dataset.title+' / 会话'}function filterItems(value){const q=value.toLowerCase();document.querySelectorAll('.row').forEach(x=>x.style.display=x.dataset.title.toLowerCase().includes(q)?'flex':'none')}function toggle(){document.getElementById('side').classList.toggle('open')}</script></body></html>
