<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>方案 B · Qoder 状态任务导航</title><style>
*{box-sizing:border-box}body{margin:0;font:13px/1.5 system-ui,"Microsoft YaHei",sans-serif;color:#26352d;background:#fff}.app{display:flex;height:100vh}.side{width:294px;background:#f4f6f3;border-right:1px solid #dce3dc;padding:18px 13px;display:flex;flex-direction:column;flex:none}.title{font-size:16px;font-weight:650;padding:3px 9px 18px}.title small{display:block;font-size:10px;font-weight:400;color:#738178;letter-spacing:.08em}.search{border:1px solid #d7e0d7;background:#fff;border-radius:6px;padding:8px 10px;color:#718078}.search input{border:0;outline:0;width:100%;font-size:12px}.search:focus-within{outline:2px solid #8bac95}.label{padding:18px 8px 6px;font-size:10px;color:#718078;letter-spacing:.08em}.task{border:1px solid transparent;background:transparent;border-radius:7px;padding:10px;width:100%;text-align:left;cursor:pointer}.task:hover{background:#e9eee8}.task.active{background:#fff;border-color:#d4dfd5;box-shadow:0 2px 6px #1e382410}.task strong{font-size:12px;font-weight:550;display:block}.task small{font-size:10px;color:#718078}.tag{float:right;font-size:9px;color:#467451;background:#e4efe5;padding:2px 5px;border-radius:3px}.tag.wait{color:#8a632b;background:#f5eddd}.main{flex:1;min-width:0}.top{height:60px;border-bottom:1px solid #e2e7e1;display:flex;align-items:center;justify-content:space-between;padding:0 30px;color:#718078;font-size:12px}.board{padding:58px 8vw}.board h1{font-size:29px;margin:12px 0}.board p{color:#718078;max-width:480px}.panel{margin-top:32px;border:1px solid #dfe6df;border-radius:10px;padding:20px;max-width:600px;background:#fafbf9}.panel b{font-size:12px}.panel p{font-size:12px;margin-bottom:0}.note{position:fixed;bottom:12px;right:18px;color:#718078;font-size:11px}.menu{display:none}@media(max-width:760px){.side{display:none;position:fixed;inset:0 auto 0 0;z-index:2;box-shadow:12px 0 30px #0002}.side.open{display:flex}.menu{display:inline-block;border:1px solid #d7e0d7;background:#fff;border-radius:5px;padding:4px 8px}.board{padding:45px 24px}}
</style></head><body><div class="app"><aside class="side" id="side"><button class="menu" onclick="toggle()" aria-label="关闭导航">×</button><div class="title"><small>QUEST WORKSPACE</small>任务指挥台</div><div class="search">⌕ <input aria-label="搜索任务" placeholder="搜索任务" oninput="filterTasks(this.value)"></div><div class="label">当前工作区 · 订单服务</div><button class="task active" data-title="库存服务延迟分析" onclick="selectTask(this)"><span class="tag">运行中</span><strong>库存服务延迟分析</strong><small>正在收集调用链与日志上下文</small></button><button class="task" data-title="权限模型重构" onclick="selectTask(this)"><span class="tag wait">待处理</span><strong>权限模型重构</strong><small>等待确认 Spec 与变更范围</small></button><div class="label">跨工作区任务</div><button class="task" data-title="开发者门户回归测试" onclick="selectTask(this)"><span class="tag">已完成</span><strong>开发者门户回归测试</strong><small>生成测试报告与变更清单</small></button><div class="label">全局入口</div><button class="task" onclick="selectTask(this)"><strong>⌘ 任务搜索与筛选</strong></button><button class="task" onclick="selectTask(this)"><strong>⚙ 设置与知识库</strong></button></aside><main class="main"><header class="top"><button class="menu" onclick="toggle()">☰</button><span id="heading">任务详情 / 库存服务延迟分析</span><span>● Agent 在线</span></header><div class="board"><span class="tag">执行工作区</span><h1>让任务自己推进，<br>把结果交给你验收。</h1><p>左侧按工作区组织任务，右侧展示当前任务的执行过程、产物和变更。状态让优先级自然浮现。</p><div class="panel"><b>交付预览</b><p>3 个文件已变更 · 1 份执行摘要 · 等待你的审查</p></div></div></main></div><script>function selectTask(el){document.querySelectorAll('.task[data-title]').forEach(x=>{x.classList.remove('active');x.removeAttribute('aria-current')});if(!el.dataset.title)return;el.classList.add('active');el.setAttribute('aria-current','page');document.getElementById('heading').textContent='任务详情 / '+el.dataset.title}function filterTasks(value){const q=value.toLowerCase();document.querySelectorAll('.task[data-title]').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q)?'block':'none')}function toggle(){document.getElementById('side').classList.toggle('open')}</script></body></html>
